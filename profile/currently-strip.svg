<svg xmlns="http://www.w3.org/2000/svg" width="760" height="116" viewBox="0 0 760 116" role="img" aria-labelledby="title desc">
  <title id="title">Current work areas</title>
  <desc id="desc">Plugins, mods, servers and networks</desc>
  <style>
    .grid { stroke: #21262d; stroke-width: 1; }
    .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .65s cubic-bezier(.2,.75,.25,1) forwards; }
    .label { opacity: 0; animation: fadeIn .4s ease-out forwards; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <path d="M72 25H688M72 47H688M72 69H688" class="grid"/>
  <path d="M72 91H688" stroke="#30363d" stroke-width="2"/>

  <g transform="translate(128 91)">
    <rect x="-19" y="-64" width="38" height="64" rx="6" fill="#238636" class="bar" style="animation-delay:.2s"/>
    <circle cy="-64" r="3" fill="#3fb950" class="label" style="animation-delay:.7s"/>
    <text y="20" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" class="label" style="animation-delay:.75s">Plugins</text>
  </g>
  <g transform="translate(296 91)">
    <rect x="-19" y="-32" width="38" height="32" rx="6" fill="#1f6feb" class="bar" style="animation-delay:.35s"/>
    <circle cy="-32" r="3" fill="#58a6ff" class="label" style="animation-delay:.85s"/>
    <text y="20" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" class="label" style="animation-delay:.9s">Mods</text>
  </g>
  <g transform="translate(464 91)">
    <rect x="-19" y="-64" width="38" height="64" rx="6" fill="#8957e5" class="bar" style="animation-delay:.5s"/>
    <circle cy="-64" r="3" fill="#bc8cff" class="label" style="animation-delay:1s"/>
    <text y="20" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" class="label" style="animation-delay:1.05s">Servers</text>
  </g>
  <g transform="translate(632 91)">
    <rect x="-19" y="-42" width="38" height="42" rx="6" fill="#9e6a03" class="bar" style="animation-delay:.65s"/>
    <circle cy="-42" r="3" fill="#e3b341" class="label" style="animation-delay:1.15s"/>
    <text y="20" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" class="label" style="animation-delay:1.2s">Networks</text>
  </g>
</svg>
