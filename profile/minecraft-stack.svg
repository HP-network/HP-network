<svg xmlns="http://www.w3.org/2000/svg" width="760" height="112" viewBox="0 0 760 112" role="img" aria-labelledby="title desc">
  <title id="title">Minecraft server stack</title>
  <desc id="desc">Paper, Spigot and Velocity connected by a server pipeline</desc>
  <style>
    .label { font: 600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #e6edf3; }
    .node { opacity: 0; animation: slideIn .45s cubic-bezier(.2,.75,.25,1) forwards; }
    .rail { stroke: #30363d; stroke-width: 2; }
    .route { stroke: #58a6ff; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 460; stroke-dashoffset: 460; animation: draw .85s .15s ease-out forwards; }
    .spark { opacity: 0; animation: sparkIn .25s 1s ease-out forwards, travel 4.2s 1.25s linear infinite; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sparkIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(460px); } }
  </style>

  <path d="M150 46H610" class="rail"/>
  <path d="M150 46H610" class="route"/>
  <g transform="translate(150 46)"><circle class="spark" r="3.5" fill="#58a6ff"/></g>

  <g transform="translate(150 46)">
    <g class="node" style="animation-delay:.28s">
      <circle r="18" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <path d="M-7 -4H7v4H-7zm2 7H5v4H-5z" fill="#58a6ff"/>
      <text y="40" text-anchor="middle" class="label">Paper</text>
    </g>
  </g>
  <g transform="translate(380 46)">
    <g class="node" style="animation-delay:.43s">
      <circle r="18" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
      <path d="m0-9 2.4 5.4 5.8.6-4.4 3.8 1.4 5.7L0 2.6-5.2 5.5l1.4-5.7-4.4-3.8 5.8-.6z" fill="#e3b341"/>
      <text y="40" text-anchor="middle" class="label">Spigot</text>
    </g>
  </g>
  <g transform="translate(610 46)">
    <g class="node" style="animation-delay:.58s">
      <circle r="18" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
      <path d="M-8 0H7m-6-6 6 6-6 6" fill="none" stroke="#bc8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="40" text-anchor="middle" class="label">Velocity</text>
    </g>
  </g>
</svg>
